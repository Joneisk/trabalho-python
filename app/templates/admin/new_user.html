{% extends "base.html" %}

{% block title %}Novo Usuário - AVA System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold">Cadastrar Novo Usuário</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Nome Completo</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="João Silva">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="email@exemplo.com">
                    </div>
                    
                    <div class="mb-3">
                        <label for="role" class="form-label fw-bold">Tipo de Usuário (Papel)</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student" selected>Estudante</option>
                            <option value="professor">Professor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Senha Temporária</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                        <div class="form-text">O usuário poderá alterar a senha após o primeiro acesso.</div>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.admin_users') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Cadastrar Usuário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
