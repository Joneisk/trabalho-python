{% extends "base.html" %}

{% block title %}Editar Usuário - AVA System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold text-primary">Editar Usuário</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Papel no Sistema</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student" {{ 'selected' if user.role == 'student' }}>Aluno</option>
                            <option value="professor" {{ 'selected' if user.role == 'professor' }}>Professor</option>
                            <option value="admin" {{ 'selected' if user.role == 'admin' }}>Administrador</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Nova Senha (deixe em branco para não alterar)</label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {{ 'checked' if user.is_active }}>
                        <label class="form-check-label" for="is_active">Usuário Ativo</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        <a href="{{ url_for('main.admin_users') }}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
