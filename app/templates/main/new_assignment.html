{% extends "base.html" %}

{% block title %}Nova Tarefa - {{ course.title }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_course', course_id=course.id) }}">{{ course.code }}</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('main.manage_activities', course_id=course.id) }}">Gerenciar Atividades</a></li>
                <li class="breadcrumb-item active">Nova Tarefa</li>
            </ol>
        </nav>
        <h2 class="fw-bold">Criar Nova Tarefa</h2>
        <p class="text-muted">{{ course.title }}</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título da Tarefa</label>
                        <input type="text" class="form-control" name="title" required placeholder="Ex: Trabalho Final do Semestre">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição Curta</label>
                        <input type="text" class="form-control" name="description" placeholder="Resumo do que deve ser feito">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Enunciado / Instruções Detalhadas</label>
                        <textarea class="form-control" name="instructions" rows="6" placeholder="Descreva aqui o que o aluno deve entregar, critérios de avaliação, etc..."></textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Nota Máxima</label>
                            <input type="number" step="0.1" class="form-control" name="max_score" value="10.0" min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Prazo de Entrega</label>
                            <input type="datetime-local" class="form-control" name="due_date">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Extensões Permitidas</label>
                            <input type="text" class="form-control" name="allowed_extensions" value=".pdf,.doc,.docx" placeholder=".pdf,.zip">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Tipo de Trabalho</label>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="is_group" name="is_group" value="yes">
                                <label class="form-check-label" for="is_group">Em Grupo</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('main.manage_activities', course_id=course.id) }}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5">Criar Tarefa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
