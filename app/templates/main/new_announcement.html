{% extends "base.html" %}

{% block title %}Novo Aviso - {{ course.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_course', course_id=course.id) }}">{{ course.code }}</a></li>
                <li class="breadcrumb-item active">Novo Aviso</li>
            </ol>
        </nav>

        <div class="card shadow-sm mt-3">
            <div class="card-header bg-white py-3">
                <h3 class="mb-0">Publicar Novo Aviso</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Título do Aviso</label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="Ex: Data da Prova Final">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label fw-bold">Conteúdo</label>
                        <textarea class="form-control" id="content" name="content" rows="8" required placeholder="Escreva o aviso detalhado aqui..."></textarea>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="is_pinned" name="is_pinned">
                        <label class="form-check-label" for="is_pinned">Fixar aviso no topo</label>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('main.view_course', course_id=course.id) }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Publicar Aviso</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
