{% extends "base.html" %}

{% block title %}Editar Tarefa - {{ course.title }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_course', course_id=course.id) }}">{{ course.code }}</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('main.manage_activities', course_id=course.id) }}">Gerenciar Atividades</a></li>
                <li class="breadcrumb-item active">Editar Tarefa</li>
            </ol>
        </nav>
        <h2 class="fw-bold">Editar Tarefa</h2>
        <p class="text-muted">{{ course.title }}</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título da Tarefa</label>
                        <input type="text" class="form-control" name="title" value="{{ assignment.title }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição Curta</label>
                        <input type="text" class="form-control" name="description" value="{{ assignment.description or '' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Instruções</label>
                        <textarea class="form-control" name="instructions" rows="6">{{ assignment.instructions or '' }}</textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Nota Máxima</label>
                            <input type="number" step="0.1" class="form-control" name="max_score" value="{{ assignment.max_score }}" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Prazo de Entrega</label>
                            <input type="datetime-local" class="form-control" name="due_date" value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') if assignment.due_date else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Extensões Permitidas</label>
                            <input type="text" class="form-control" name="allowed_extensions" value="{{ assignment.allowed_extensions or '' }}">
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('main.manage_activities', course_id=course.id) }}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
