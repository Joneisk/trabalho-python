{% extends "base.html" %}

{% block title %}Cadastro - AVA System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4 mb-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                    <h2 class="fw-bold">Criar Conta</h2>
                    <p class="text-muted">Junte-se à nossa comunidade de aprendizagem</p>
                </div>
                
                <form method="POST">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="name" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="João Silva">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail Institucional</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="joao@instituicao.edu.br">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="role" class="form-label">Tipo de Usuário</label>
                            <select class="form-select" id="role" name="role">
                                <option value="student" selected>Estudante</option>
                                <option value="professor">Professor</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="student_id" class="form-label">Matrícula (opcional)</label>
                            <input type="text" class="form-control" id="student_id" name="student_id" placeholder="2024001">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Mín. 6 caracteres">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">Criar Minha Conta</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0">Já tem uma conta? <a href="{{ url_for('auth.login') }}">Faça login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
